[workspace]
resolver = "2"
members = [
    "crates/ft8rs-build",
    "crates/ft8rs-core",
    "crates/ft8rs-engine",
    "crates/ft8rs-cli",
]

# Performance: cross-crate inlining (thin LTO) + a single codegen unit. These
# are optimization-only and do not change floating-point semantics, so the
# byte-identical WSJT-X/JTDX baselines are preserved. Use this profile for the
# shipped binaries and final acceptance runs.
[profile.release]
codegen-units = 1
lto = "thin"

# Fast iteration profile for the test/debug loop. Keeps `debug-assertions = false`
# (inherited from release, so `assert_release_mode()` and the decode timing budgets
# still hold), but trades the shipped binary's last-mile codegen for build speed.
# opt-level/LTO are optimization-only and do not alter IEEE float semantics, so
# results match the release binary. Use `--release` for the final acceptance run.
[profile.fast]
inherits = "release"
opt-level = 2
lto = false
codegen-units = 256
