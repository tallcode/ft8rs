[workspace]
resolver = "2"
members = [
    "crates/ft8rs-build",
    "crates/ft8rs-core",
    "crates/ft8rs-engine",
    "crates/ft8rs-cli",
    "crates/ft8rs-gui",
]

# Performance: whole-program inlining (fat LTO) + a single codegen unit, and
# abort-on-panic for the shipped binary (smaller/faster; `cargo test` always
# unwinds, so tests are unaffected). All optimization-only — they do not change
# floating-point semantics, so the byte-identical WSJT-X/JTDX baselines are
# preserved. Use this profile for the shipped binaries and final acceptance runs.
# (x86_64 CI builds also pin target-cpu=x86-64-v3 via .cargo/config.toml.)
[profile.release]
codegen-units = 1
lto = "fat"
panic = "abort"

# Fast iteration profile for the test/debug loop. Keeps `debug-assertions = false`
# (inherited from release, so `assert_release_mode()` and the decode timing budgets
# still hold), but trades the shipped binary's last-mile codegen for build speed.
# opt-level/LTO are optimization-only and do not alter IEEE float semantics, so
# results match the release binary. Use `--release` for the final acceptance run.
[profile.fast]
inherits = "release"
opt-level = 2
lto = false
codegen-units = 256

# Make `cargo run` (dev) usable for live decoding: the GUI/engine crates stay at
# opt-level 0 so the edit→run loop compiles fast, but the decode core and its
# math dependencies are optimized so decoding keeps up with the 15 s slots
# without a full release build. opt-level only affects speed, not IEEE float
# semantics, so decode results match release.
[profile.dev.package.ft8rs-core]
opt-level = 3

[profile.dev.package."*"]
opt-level = 3
