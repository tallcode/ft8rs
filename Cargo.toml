[package]
name = "ft8rs"
version = "0.1.0"
edition = "2021"
description = "FT8/FT4 encoder/decoder in pure Rust"
license = "GPL-3.0"

[[bin]]
name = "ft8rs"
path = "src/main.rs"

[features]
default = []
# Compile-time: force rustfft engine (4096-point). Default is FFTW (3840).
force-rustfft = []

[dependencies]
rayon = "1"
rustfft = "6"  # Dual-engine: rustfft for baseline comparison, FFTW for WSJT-X alignment

hound = "3"
num-bigint = "0.4"
num-complex = "0.4"
num-traits = "0.2"
clap = { version = "4", features = ["derive"] }
