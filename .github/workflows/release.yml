name: Release builds

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.package_name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            package_name: ft8rs-linux-x86_64
            artifact_name: ft8rs-linux-x86_64.tar.gz
          - os: macos-13
            package_name: ft8rs-macos-x86_64
            artifact_name: ft8rs-macos-x86_64.tar.gz
          - os: windows-latest
            package_name: ft8rs-windows-x86_64
            artifact_name: ft8rs-windows-x86_64.zip

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libfftw3-dev pkg-config

      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: |
          brew update
          brew install fftw

      - name: Install Windows dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          C:\vcpkg\vcpkg.exe install fftw3:x64-windows
          "FFTW_DIR=C:\vcpkg\installed\x64-windows" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build release binary on Linux
        if: runner.os == 'Linux'
        env:
          RUSTFLAGS: -C link-arg=-Wl,-rpath,$ORIGIN
        run: cargo build --release

      - name: Build release binary on macOS
        if: runner.os == 'macOS'
        env:
          RUSTFLAGS: -C link-arg=-Wl,-rpath,@loader_path
        run: cargo build --release

      - name: Build release binary on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: cargo build --release

      - name: Package Linux release
        if: runner.os == 'Linux'
        run: |
          set -eux
          pkg="${{ matrix.package_name }}"
          mkdir -p "dist/$pkg"
          cp target/release/ft8rs "dist/$pkg/"
          fftw_lib="$(ldconfig -p | awk '/libfftw3.so.3 / {print $NF; exit}')"
          if [ -z "$fftw_lib" ]; then
            echo "libfftw3.so.3 was not found" >&2
            exit 1
          fi
          cp "$fftw_lib" "dist/$pkg/"
          chmod +x "dist/$pkg/ft8rs"
          printf '%s\n' 'Run ./ft8rs from this directory. libfftw3.so.3 is bundled next to the binary.' > "dist/$pkg/README.txt"
          tar -czf "${{ matrix.artifact_name }}" -C dist "$pkg"

      - name: Package macOS release
        if: runner.os == 'macOS'
        run: |
          set -eux
          pkg="${{ matrix.package_name }}"
          mkdir -p "dist/$pkg"
          cp target/release/ft8rs "dist/$pkg/"
          cp "$(brew --prefix fftw)/lib/libfftw3.3.dylib" "dist/$pkg/"
          for dep in $(otool -L "dist/$pkg/ft8rs" | awk '/libfftw3/ {print $1}'); do
            install_name_tool -change "$dep" "@loader_path/libfftw3.3.dylib" "dist/$pkg/ft8rs"
          done
          install_name_tool -id "@loader_path/libfftw3.3.dylib" "dist/$pkg/libfftw3.3.dylib"
          chmod +x "dist/$pkg/ft8rs"
          printf '%s\n' 'Run ./ft8rs from this directory. libfftw3.3.dylib is bundled next to the binary.' > "dist/$pkg/README.txt"
          tar -czf "${{ matrix.artifact_name }}" -C dist "$pkg"

      - name: Package Windows release
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $pkg = "${{ matrix.package_name }}"
          New-Item -ItemType Directory -Force -Path "dist\$pkg" | Out-Null
          Copy-Item "target\release\ft8rs.exe" "dist\$pkg\"
          $fftwDll = Get-ChildItem "C:\vcpkg\installed\x64-windows\bin" -Filter "fftw3*.dll" | Select-Object -First 1
          if (-not $fftwDll) {
            throw "fftw3 DLL was not found"
          }
          Copy-Item $fftwDll.FullName "dist\$pkg\"
          "Run .\ft8rs.exe from this directory. The FFTW DLL is bundled next to the binary." |
            Out-File -FilePath "dist\$pkg\README.txt" -Encoding utf8
          Compress-Archive -Path "dist\$pkg" -DestinationPath "${{ matrix.artifact_name }}" -Force

      - name: Upload packaged binary
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.package_name }}
          path: ${{ matrix.artifact_name }}
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download packaged binaries
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release metadata
        id: meta
        run: |
          short_sha="${GITHUB_SHA::7}"
          tag="main-${GITHUB_RUN_NUMBER}-${short_sha}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          find artifacts -maxdepth 2 -type f -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ft8rs ${{ steps.meta.outputs.tag }}
          body: |
            Automated release built from `${{ github.sha }}` on `main`.

            Assets include FFTW runtime libraries next to the `ft8rs` executable:
            - `ft8rs-linux-x86_64.tar.gz`
            - `ft8rs-macos-x86_64.tar.gz`
            - `ft8rs-windows-x86_64.zip`
          files: |
            artifacts/**/*.tar.gz
            artifacts/**/*.zip
            SHA256SUMS.txt
