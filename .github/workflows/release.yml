name: Build packages
run-name: Packages · ${{ github.ref_name }} · ${{ github.event_name }}

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.package_name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            package_name: ft8rs-linux-x86_64
          - os: windows-latest
            platform: windows
            package_name: ft8rs-windows-x86_64

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust
        id: rust
        uses: dtolnay/rust-toolchain@stable

      - name: Prepare version and provenance
        id: metadata
        run: >-
          python scripts/package_release.py metadata
          --platform "${{ matrix.platform }}"
          --output "${{ runner.temp }}/ft8rs-build-info.json"

      - name: Cache Cargo build data
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          # Each source snapshot can save fresh build data. Tag/branch builds
          # restore compatible main caches; GitHub cannot share sibling-tag caches.
          key: cargo-release-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.rust.outputs.cachekey }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'crates/**/Cargo.toml', '.cargo/config.toml') }}-${{ github.sha }}
          restore-keys: |
            cargo-release-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.rust.outputs.cachekey }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'crates/**/Cargo.toml', '.cargo/config.toml') }}-
            cargo-release-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.rust.outputs.cachekey }}-

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev pkg-config

      - name: Build CLI release binary
        if: runner.os == 'Linux'
        env:
          FT8RS_RELEASE_TAG: ${{ steps.metadata.outputs.release_tag }}
        run: cargo build --release --locked -p ft8rs-cli --timings

      # The GUI is shipped on Windows this phase (macOS is built locally; Linux
      # GUI packaging is out of scope).
      - name: Build CLI and GUI together (Windows)
        if: runner.os == 'Windows'
        env:
          FT8RS_RELEASE_TAG: ${{ steps.metadata.outputs.release_tag }}
        run: cargo build --release --locked -p ft8rs-cli -p ft8rs-gui --timings

      - name: Package binaries and source information
        run: >-
          python scripts/package_release.py package
          --metadata "${{ runner.temp }}/ft8rs-build-info.json"

      - name: Upload build timings
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: build-timings-${{ matrix.platform }}
          path: target/cargo-timings/*.html
          if-no-files-found: ignore
          retention-days: 1
          overwrite: true

      - name: Upload packaged binary
        uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.metadata.outputs.artifact_name }}
          path: |
            dist/${{ steps.metadata.outputs.archive_name }}
            dist/${{ steps.metadata.outputs.archive_name }}.sha256
          if-no-files-found: error
          retention-days: 1
          overwrite: true

  release:
    # Manual/main builds only upload short-lived artifacts. A manual dispatch
    # against a tag must never publish a release either.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download packaged binaries
        uses: actions/download-artifact@v7
        with:
          path: artifacts
          pattern: ft8rs-*

      - name: Prepare checksums
        run: |
          find artifacts -maxdepth 2 -type f -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: ft8rs ${{ github.ref_name }}
          body: |
            Release built from `${{ github.sha }}`.

            Assets use the default rustfft@3840 backend and have no FFTW runtime dependency:
            - `ft8rs-linux-x86_64.tar.gz` — CLI
            - `ft8rs-windows-x86_64.zip` — GUI (`ft8rs-gui.exe`) + CLI (`ft8rs.exe`)

            `ALLCALL7.TXT` is bundled next to the binaries for JTDX profile
            callsign filtering and can be updated in place.

            macOS release packaging is temporarily disabled while hosted runner
            queue times are high.
          files: |
            artifacts/**/*.tar.gz
            artifacts/**/*.zip
            SHA256SUMS.txt
