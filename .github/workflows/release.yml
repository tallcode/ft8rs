name: CI and release

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  test:
    name: Release tests
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libfftw3-dev pkg-config

      - name: Run default short stream test
        run: cargo test --release test_stream_decode_short_audio -- --nocapture

      - name: Run default long stream test
        run: cargo test --release test_stream_decode_long_audio -- --nocapture

      - name: Run FFTW short stream test
        run: cargo test --release --features fftw test_stream_decode_short_audio -- --nocapture

      - name: Run FFTW long stream test
        run: cargo test --release --features fftw test_stream_decode_long_audio -- --nocapture

  build:
    name: Build ${{ matrix.package_name }}
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            package_name: ft8rs-linux-x86_64
            artifact_name: ft8rs-linux-x86_64.tar.gz
            binary_name: ft8rs
          # macOS runners are temporarily disabled because queue times are too
          # long. Re-enable this matrix entry when release coverage needs it.
          # - os: macos-13
          #   package_name: ft8rs-macos-x86_64
          #   artifact_name: ft8rs-macos-x86_64.tar.gz
          #   binary_name: ft8rs
          - os: windows-latest
            package_name: ft8rs-windows-x86_64
            artifact_name: ft8rs-windows-x86_64.zip
            binary_name: ft8rs.exe

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev pkg-config

      - name: Build default release binary
        env:
          FT8RS_RELEASE_TAG: ${{ github.ref_name }}
        run: cargo build --release

      - name: Package Unix release
        if: runner.os != 'Windows'
        run: |
          set -eux
          pkg="${{ matrix.package_name }}"
          mkdir -p "dist/$pkg"
          cp "target/release/${{ matrix.binary_name }}" "dist/$pkg/"
          chmod +x "dist/$pkg/${{ matrix.binary_name }}"
          printf '%s\n' 'Run ./ft8rs from this directory. This build uses rustfft@3840 and has no FFTW runtime dependency.' > "dist/$pkg/README.txt"
          tar -czf "${{ matrix.artifact_name }}" -C dist "$pkg"

      - name: Package Windows release
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $pkg = "${{ matrix.package_name }}"
          New-Item -ItemType Directory -Force -Path "dist\$pkg" | Out-Null
          Copy-Item "target\release\${{ matrix.binary_name }}" "dist\$pkg\"
          "Run .\ft8rs.exe from this directory. This build uses rustfft@3840 and has no FFTW runtime dependency." |
            Out-File -FilePath "dist\$pkg\README.txt" -Encoding utf8
          Compress-Archive -Path "dist\$pkg" -DestinationPath "${{ matrix.artifact_name }}" -Force

      - name: Upload packaged binary
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.package_name }}
          path: ${{ matrix.artifact_name }}
          if-no-files-found: error

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download packaged binaries
        uses: actions/download-artifact@v7
        with:
          path: artifacts

      - name: Prepare checksums
        run: |
          find artifacts -maxdepth 2 -type f -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: ft8rs ${{ github.ref_name }}
          body: |
            Release built from `${{ github.sha }}`.

            Assets use the default rustfft@3840 backend and have no FFTW runtime dependency:
            - `ft8rs-linux-x86_64.tar.gz`
            - `ft8rs-windows-x86_64.zip`

            macOS release packaging is temporarily disabled while hosted runner
            queue times are high.
          files: |
            artifacts/**/*.tar.gz
            artifacts/**/*.zip
            SHA256SUMS.txt
