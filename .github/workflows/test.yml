name: Tests

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  release-tests:
    name: Release tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo build data
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-test-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-test-${{ runner.os }}-

      - name: Install Linux test dependencies
        run: |
          # The hosted Azure mirror can fail DNS; prefer Ubuntu's public archive.
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/apt-mirrors.txt
          fi
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y libasound2-dev libfftw3-dev pkg-config

      - name: Run default short stream test
        run: cargo test --release -p ft8rs test_stream_decode_short_audio -- --nocapture

      - name: Run default long stream test
        run: cargo test --release -p ft8rs test_stream_decode_long_audio -- --nocapture

      - name: Run FFTW short stream test
        run: cargo test --release -p ft8rs --features fftw test_stream_decode_short_audio -- --nocapture

      - name: Run FFTW long stream test
        run: cargo test --release -p ft8rs --features fftw test_stream_decode_long_audio -- --nocapture
