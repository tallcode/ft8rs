name: Tests

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  release-tests:
    name: Release tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Verify Linux dependency cache behavior
        run: python3 -B -m unittest discover -s scripts -p test_install_linux_deps.py -v

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo build data
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-test-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-test-${{ runner.os }}-

      - name: Identify Linux dependency cache
        id: deb-meta
        run: python3 scripts/install_linux_deps.py --metadata-only libasound2-dev libfftw3-dev pkg-config

      - name: Restore Linux DEB snapshot
        id: deb-cache
        uses: actions/cache/restore@v5
        with:
          path: dist/linux-deps/snapshot
          key: ${{ steps.deb-meta.outputs.cache-prefix }}-latest
          restore-keys: |
            ${{ steps.deb-meta.outputs.cache-prefix }}-

      - name: Install Linux test dependencies
        id: deb-install
        run: python3 scripts/install_linux_deps.py libasound2-dev libfftw3-dev pkg-config

      - name: Save updated Linux DEB snapshot
        if: steps.deb-install.outputs.cache-key != steps.deb-cache.outputs.cache-matched-key
        uses: actions/cache/save@v5
        with:
          path: dist/linux-deps/snapshot
          key: ${{ steps.deb-install.outputs.cache-key }}

      - name: Run default short stream test
        run: cargo test --release -p ft8rs test_stream_decode_short_audio -- --nocapture

      - name: Run default long stream test
        run: cargo test --release -p ft8rs test_stream_decode_long_audio -- --nocapture

      - name: Run FFTW short stream test
        run: cargo test --release -p ft8rs --features fftw test_stream_decode_short_audio -- --nocapture

      - name: Run FFTW long stream test
        run: cargo test --release -p ft8rs --features fftw test_stream_decode_long_audio -- --nocapture
