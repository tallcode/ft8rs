[package]
name = "ft8rs-engine"
version = "0.0.0"
edition = "2021"
license = "GPL-3.0-only"
description = "ft8.rs live runtime: soundcard capture + UDP reporting"

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
ron = "0.12.3"
log = "0.4.35"
ft8rs = { version = "0.1.0", path = "../ft8rs-core" }
cpal = "0.18.2"

[features]
default = []
fftw = ["ft8rs/fftw"]
