[package]
name = "ft8rs"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
description = "FT8 streaming decoder core: decode/stream/file-input, UI-independent"
repository = "https://github.com/tallcode/ft8rs"
homepage = "https://ft8.rs"
documentation = "https://docs.rs/ft8rs"
readme = "README.md"
keywords = ["ft8", "wsjtx", "jtdx", "ham-radio", "decoder"]
categories = ["science", "multimedia::audio"]
# Keep the registry package small while retaining all library sources and the
# fixtures needed by its unit tests. Full audio regressions live in Git.
include = [
    "Cargo.toml",
    "build.rs",
    "README.md",
    "LICENSE",
    "NOTICE",
    "src/**/*.rs",
    "src/**/README.md",
    "tests/decoder/*.rs",
    "tests/decoder/data/ft8/protocol/**",
    "tests/decoder/data/ft8/calls/**",
    "tests/decoder/data/ft8/waveforms/**",
    "tests/decoder/data/ft8/provenance/**",
    "tests/decoder/data/ft8/upstream/**",
    "tests/decoder/data/ft8/upstream-retention/**",
]

# The source directory remains crates/ft8rs-core; both the published package and
# the library are named ft8rs, preserving the existing use ft8rs::... imports.
[lib]
name = "ft8rs"
path = "src/lib.rs"

[features]
default = []
# Compile-time: default rustfft@3840. Enable fftw for FFTW@3840 validation.
fftw = []

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
rustfft = "6.4.1"
hound = "3.5.1"
num-bigint = "0.5.1"

[dev-dependencies]
serde_json = "1.0"
