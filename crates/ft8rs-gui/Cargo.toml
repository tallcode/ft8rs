[package]
name = "ft8rs-gui"
version = "0.0.0"
edition = "2021"
license = "GPL-3.0"
description = "FT8 streaming decoder GUI (egui)"

[[bin]]
name = "ft8rs-gui"
path = "src/main.rs"

[dependencies]
ft8rs-core = { path = "../ft8rs-core" }
ft8rs-engine = { path = "../ft8rs-engine" }
eframe = { version = "0.29", features = ["persistence"] }
muda = "0.15"
image = { version = "0.25", default-features = false, features = ["png"] }

# Windows-only: extract the HWND from eframe's window handle to attach a native
# Win32 menu bar (muda init_for_hwnd). Version matches eframe's raw-window-handle.
[target.'cfg(windows)'.dependencies]
raw-window-handle = "0.6"
# Force a frame recalculation after attaching the menu (SetWindowPos +
# SWP_FRAMECHANGED) so the GL surface resizes to the menu-shrunk client area and
# no unpainted strip remains. Version matches muda's windows-sys.
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }

[build-dependencies]
ft8rs-build = { path = "../ft8rs-build" }

# Windows-only: embed the app icon into the .exe so it shows in Explorer / the
# taskbar pin. The .ico is generated from assets/ft8rs.png at build time.
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
ico = "0.5"
image = { version = "0.25", default-features = false, features = ["png"] }

[features]
default = []
fftw = ["ft8rs-core/fftw", "ft8rs-engine/fftw"]
