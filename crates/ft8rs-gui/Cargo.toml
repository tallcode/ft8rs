[package]
name = "ft8rs-gui"
version = "0.0.0"
edition = "2021"
license = "GPL-3.0-only"
description = "FT8 streaming decoder GUI (egui)"

[[bin]]
name = "ft8rs"
path = "src/main.rs"
# The core library also uses `ft8rs`; keep its API documentation intact.
doc = false

[dependencies]
log = "0.4.35"
sys-locale = "0.3.2"
ttf-parser = "0.25.1"
# Reuse the same OS font discovery component used by egui_system_font_provider.
fontique = { version = "0.11.1", default-features = false, features = ["system", "fontconfig-dlopen"] }
ft8rs = { version = "0.1.0", path = "../ft8rs-core" }
ft8rs-engine = { path = "../ft8rs-engine" }
eframe = { version = "0.37.0", features = ["persistence", "glow"] }
egui_extras = { version = "0.37.0", default-features = false, features = ["svg"] }
muda = "0.21.2"
image = { version = "0.25.10", default-features = false, features = ["png"] }

# Windows-only: extract the HWND from eframe's window handle to attach a native
# Win32 menu bar (muda init_for_hwnd). Version matches eframe's raw-window-handle.
[target.'cfg(windows)'.dependencies]
raw-window-handle = "0.6.2"

[build-dependencies]
ft8rs-build = { path = "../ft8rs-build" }

# Windows-only: embed the app icon into the .exe so it shows in Explorer / the
# taskbar pin. The .ico is generated from assets/ft8rs.png at build time.
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1.34"
ico = "0.6.0"
image = { version = "0.25.10", default-features = false, features = ["png"] }

[features]
default = []
fftw = ["ft8rs/fftw", "ft8rs-engine/fftw"]
